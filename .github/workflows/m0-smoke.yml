name: M0-M6-0 verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  linux-smoke:
    name: Linux / Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify Godot Standard
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          url="https://godot-releases.nbg1.your-objectstorage.com/${GODOT_VERSION}-stable/${archive}"
          curl --fail --location --silent --show-error "$url" --output godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum --check --strict
          unzip -q godot.zip -d .godot-bin
          chmod +x ".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Run smoke test and project boot
        shell: bash
        run: |
          set -euo pipefail
          godot=".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --version | grep '^4\.7\.2\.stable\.'
          "$godot" --headless --path . --script res://tests/smoke_test.gd
          "$godot" --headless --path . --quit-after 1

      - name: Run M1 state-model tests
        shell: bash
        run: |
          set -euo pipefail
          godot=".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --editor --path . --quit
          "$godot" --headless --path . --script res://tests/m1_test_runner.gd

      - name: Run M2 time-resource tests
        shell: bash
        run: |
          set -euo pipefail
          godot=".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --path . --script res://tests/m2_test_runner.gd

      - name: Run M3 decision mechanics tests
        shell: bash
        run: |
          set -euo pipefail
          godot=".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --path . --script res://tests/m3_test_runner.gd

      - name: Run M4 atomic action-resolution tests
        shell: bash
        run: |
          set -euo pipefail
          godot=".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --path . --script res://tests/m4_test_runner.gd

      - name: Run M5 social integration contract gate
        shell: bash
        run: |
          python tools/verify_m5.py --godot ".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Preserve M5 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-evidence-linux
          path: builds/m5-runtime-evidence.*
          if-no-files-found: error

      - name: Run M6-0 autonomous progression contract gate
        shell: bash
        run: |
          python tools/verify_m60.py --godot ".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Preserve M6-0 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m60-evidence-linux
          path: builds/m60-runtime-evidence.*
          if-no-files-found: error

  windows-smoke:
    name: Windows / Godot 4.7.2
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download and verify Godot Standard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "Godot_v$env:GODOT_VERSION-stable_win64.exe.zip"
          $url = "https://godot-releases.nbg1.your-objectstorage.com/$env:GODOT_VERSION-stable/$archive"
          Invoke-WebRequest -Uri $url -OutFile godot.zip
          $actualHash = (Get-FileHash godot.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = "731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953"
          if ($actualHash -ne $expectedHash) {
            throw "Godot archive hash mismatch: $actualHash"
          }
          Expand-Archive -Path godot.zip -DestinationPath .godot-bin

      - name: Run smoke test and project boot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          $version = (& $godot --version).Trim()
          if (-not $version.StartsWith("4.7.2.stable.")) {
            throw "Unexpected Godot version: $version"
          }
          & $godot --headless --path . --script res://tests/smoke_test.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path . --quit-after 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M1 state-model tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $godot --headless --path . --script res://tests/m1_test_runner.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M2 time-resource tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --path . --script res://tests/m2_test_runner.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M3 decision mechanics tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --path . --script res://tests/m3_test_runner.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M4 atomic action-resolution tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godot = ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          & $godot --headless --path . --script res://tests/m4_test_runner.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run M5 social integration contract gate
        shell: pwsh
        run: |
          python tools/verify_m5.py --godot ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          exit $LASTEXITCODE

      - name: Preserve M5 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-evidence-windows
          path: builds/m5-runtime-evidence.*
          if-no-files-found: error

      - name: Run M6-0 autonomous progression contract gate
        shell: pwsh
        run: |
          python tools/verify_m60.py --godot ".godot-bin/Godot_v$env:GODOT_VERSION-stable_win64_console.exe"
          exit $LASTEXITCODE

      - name: Preserve M6-0 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m60-evidence-windows
          path: builds/m60-runtime-evidence.*
          if-no-files-found: error

  m5-determinism:
    name: M5 / Linux-Windows evidence equality
    needs: [linux-smoke, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download both platform records
        uses: actions/download-artifact@v4
        with:
          pattern: m5-evidence-*
          path: evidence

      - name: Compare full native execution records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = sorted(Path("evidence").glob("*/m5-runtime-evidence.json"))
          if len(paths) != 2:
              raise SystemExit("Both Linux and Windows execution records are required")
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit("M5 platform records differ")
          print("M5 Linux/Windows execution records are byte-identical; each platform's contract gate retains its own status.")
          PY

  m60-determinism:
    name: M6-0 / Linux-Windows evidence equality
    needs: [linux-smoke, windows-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download both platform records
        uses: actions/download-artifact@v4
        with:
          pattern: m60-evidence-*
          path: evidence

      - name: Compare full native execution records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path("evidence").glob("*/m60-runtime-evidence.json"))
          if len(paths) != 2:
              raise SystemExit("Both Linux and Windows execution records are required")
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit("M6-0 platform records differ")
          for path in paths:
              record = json.loads(path.read_text(encoding="utf-8"))
              if record["m60_status"] != "PASS" or record["failures"]:
                  raise SystemExit("Each native contract gate must pass")
          print("M6-0 Linux/Windows execution records are byte-identical; both native gates passed.")
          PY
